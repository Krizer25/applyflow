[project]
name = "terminal-scanner"
version = "0.1.0"
description = "Authorized terminal security assessment scaffold"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
scanner = "scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
